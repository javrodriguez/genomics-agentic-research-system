# The egress proxy's policy for one take: a CONNECT to exactly one host, on port 443, and nothing else.
# box/egress/proxy_conf.py renders this template, filling its one slot with the take's harness's host, and
# checks the rendered file over a closed directive grammar. The take's internal network has no other route out.
http_port 3128
acl tls_port port 443
acl tunnel method CONNECT
acl api_host dstdomain -n @ALLOWED_HOST@
http_access deny !tunnel
http_access deny tunnel !tls_port
http_access allow tunnel api_host
http_access deny all
cache deny all
access_log stdio:/dev/stdout
pid_filename none
