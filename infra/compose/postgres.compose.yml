services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    ports:
      - "${PG_BIND_ADDR:-127.0.0.1}:${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - pg_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 25
    restart: ${PG_RESTART:-unless-stopped}
secrets:
  pg_password:
    file: ${PG_PASSWORD_FILE}
volumes:
  pgdata:
    name: ${COMPOSE_PROJECT}_pgdata${COMPOSE_VOLUME_SUFFIX:-}
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PG_DATA_DIR}
