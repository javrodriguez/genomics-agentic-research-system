# Configuration for assay atacseq_bulk, project {{project_title}}
#
# Stage 00 put this here so you never author a config from a blank file. Everything that can be
# filled in for you already has been. What remains is marked <REQUIRED> -- those are scientific
# decisions, and no stage will substitute a value for them, because a wrong one produces a
# confident wrong answer rather than an error.
#
# Full rationale for every key: _references/config_schema.md

# --- what to align against ---------------------------------------------------------------------
# The genome menu at stage 02 fills fasta, gtf, mito_name, macs_gsize and derived_dir together,
# so they can never be mismatched. Paste paths here only for a reference that is not in
# _references/genomes.md.
reference:
  fasta: <REQUIRED: choose a genome at stage 02, or paste a FASTA path>
  gtf:   <REQUIRED: choose a genome at stage 02, or paste the matching GTF path>

  # The assembly's mitochondrial contig name (Ensembl: MT, UCSC: chrM). ATAC libraries carry
  # heavy mitochondrial signal and the pipeline filters those reads BY THIS NAME -- a wrong
  # name silently filters nothing. Set by the genome menu.
  mito_name: <REQUIRED: set by the genome menu at stage 02>

  # Optional: an ENCODE blacklist BED of artifact regions to exclude from peaks. This cluster
  # may hold a shared blacklist.bed plus v1/v2 variants -- they differ, so pick
  # deliberately or leave peak filtering off.
  # blacklist: /path/to/site/references/hg38/blacklist.bed

  # Optional but recommended: aligner-index cache, keyed by PIPELINE version because an index
  # is rejected by a different aligner version. Uncommented by the genome menu. If the keyed
  # directory does not exist yet, the first run builds the indices and harvests them into it.
  # derived_dir: (set by the genome menu at stage 02)

aligner: bwa                  # bwa | bowtie2 | chromap | star -- nf-core/atacseq default is bwa

# --- how peaks are called ----------------------------------------------------------------------
peaks:
  # narrow | broad. Changes what a "peak" means: narrow is point-source (the ATAC convention),
  # broad is domain-scale enrichment. A scientific decision -- chosen from the menu at stage 02,
  # never defaulted.
  type: <REQUIRED: choose at stage 02 -- narrow or broad>

  # MACS2 effective genome size. A property of the assembly, not of the project; travels with
  # the genome choice (see _references/genomes.md).
  macs_gsize: <REQUIRED: set by the genome menu at stage 02>

# --- where it runs -----------------------------------------------------------------------------
# Infrastructure, not science. Verified on this cluster; change if your allocation differs.
compute:
  partition: cpu_medium
  time: "2-00:00:00"
  cpus: 8
  mem: 64G
  # Nextflow's scratch. NEVER inside the project: work/ retains every process output so
  # -resume can reuse it, and a run accumulates hundreds of GB there. results/ is published
  # with mode 'copy', so work/ is disposable once a run succeeds.
  work_dir: {{work_dir}}
