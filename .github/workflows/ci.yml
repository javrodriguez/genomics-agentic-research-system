# The deterministic core, on every push -- the same two commands the repo says to run
# before committing (CLAUDE.md). Stdlib only, nothing to install: the helpers and their
# tests run on stock Python >= 3.6 by contract (decision 0011). Tests that need the
# cluster -- a pinned nf-core checkout or the reference tree -- skip cleanly here as
# environment failures, exactly as they do on any machine that is not the cluster.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, deliberately. The pre-registration integrity check below proves that
          # the thresholds were frozen BEFORE the runs, and it can only do that by reading the
          # commit that froze them. At the default depth of 1 that history is absent -- and the
          # check does not merely skip, it used to pass hollowly, comparing the file to itself.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test suite
        env:
          GARS_ROW5_SCRATCH: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: python3 tests/run_tests.py
      - name: Contract lint
        run: python3 tests/check_contracts.py
      - name: Count guard
        # The suite's size against what README.md and DEVELOPMENT.md claim it is. A wrong count
        # reached eleven job-application files before it was caught by eye; this is why it
        # cannot happen twice.
        run: python3 tests/check_counts.py
      - name: Evaluation harness
        # The Layer B harness's own tests, counted separately from the suite above so the count
        # guard cannot be fooled by tests added here.
        run: python3 evals/test_harness.py
      - name: Pre-registration integrity
        # Thresholds unmoved since the freeze, every pinned file unchanged, every control
        # behaving opposite its positive, every hand-labelled grader suite still passing.
        run: python3 evals/check_results.py --controls --lexicon

  gap-study:
    # ---- the Gap Study (evals/gap-study), checked at the commit its final verifier checked ------
    # Ruling 38. The study is done, and its guards bind the system under test to the tree its takes
    # ran against: the ledger check requires HEAD's gars/ to be that tree. That was right while takes
    # ran, and it would fail every later change to gars/, which is meant to keep evolving. So this
    # job checks out the study's done commit b735229, by full sha because a sha cannot be moved,
    # at full depth, and runs the study's own checks there, unchanged. The records written after it (the gate-3
    # sentence, the rulings that followed) are documents, and main's own job does not check them
    # as the study.
    runs-on: ubuntu-latest
    # No automatic git maintenance in this job. From git 2.55, every commit starts a detached
    # repack of any repo holding more than ~256 loose objects, and each mutation sandbox commits a
    # few thousand files. When a guard then deletes the sandbox's .git (m_shallow_history), the
    # repack can remove a file mid-delete: rmtree raises FileNotFoundError, the harness scores the
    # raise as exit 0, and the guard reads "did NOT go red" without its check ever running (run
    # 35906997012, attempt 1). Round 2 fixed the same race inside its own harness (scratch_git.py);
    # this study is frozen at b735229, so the fix lives here, in the job, and no study byte changes.
    env:
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: maintenance.auto
      GIT_CONFIG_VALUE_0: "false"
      GIT_CONFIG_KEY_1: gc.auto
      GIT_CONFIG_VALUE_1: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b735229f5c9213bb20c7e49fb7ceddddbcac7abc
          # Full history: the ledger and the frozen-file checks read the commits that froze the
          # study and registered each take, and refuse in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gap Study harness
        # Every grader driven to every label it can emit, including the ones that mean the agent
        # did the wrong thing.
        run: python3 evals/gap-study/test_harness.py
      - name: Gap Study contract quotes
        # Every contract sentence the design rests on is still a byte substring of the blob it
        # was pinned to. A contract edited after the freeze is a visible failure, not a silent
        # change of meaning.
        run: python3 evals/gap-study/contracts.py --check
      - name: Gap Study fixtures
        # Each fixture still accepted by the system under test's own front door, and its counts
        # still equal to what the generator claims. The first study froze a fixture stage 00
        # refuses outright; this is that lesson, executable.
        run: python3 evals/gap-study/fixtures/check_fixture.py --all
      - name: Gap Study language guard
        # The words and number-shapes a three-take study may not publish. An occurrence is
        # excused one line at a time, pinned to that line's exact text.
        run: python3 evals/gap-study/lint_language.py evals/gap-study/
      - name: Gap Study ledger
        # Refuses in a shallow clone rather than reporting a pass it cannot support.
        run: python3 evals/gap-study/check_results.py --ledger
      - name: Gap Study controls, as published
        # --controls exits 1 when any model carries one label on both halves of a task (checklist
        # line 7). Once results exist that is a finding the study publishes, not a broken build, so
        # the step re-derives it and requires it byte-identical to the committed record: it goes red
        # only if the finding changes. Before any results file is committed it must exit 0.
        run: |
          set +e
          python3 evals/gap-study/check_results.py --controls > "$RUNNER_TEMP/controls.txt" 2>&1
          code=$?
          set -e
          printf 'exit %s\n' "$code" >> "$RUNNER_TEMP/controls.txt"
          if [ -f evals/gap-study/verification/controls-as-published.txt ]; then
            diff evals/gap-study/verification/controls-as-published.txt "$RUNNER_TEMP/controls.txt"
          else
            cat "$RUNNER_TEMP/controls.txt"
            test "$code" -eq 0
          fi
      - name: Gap Study mutations
        # Every guard broken on purpose in a throwaway copy and asserted to go red. A guard nobody
        # has watched fail is a guard nobody knows is wired up, and this study has already shipped
        # four that looked correct and were not.
        run: python3 evals/gap-study/test_harness.py --mutations

  gap-study-2:
    # ---- the Gap Study, round 2 (evals/gap-study-2), checked at the commit its final verifier checked ----
    # Round 2 is a copy of round 1's harness with its own name, paths and fixtures. While it ran, its
    # guards were checked at every pushed commit. The study is done (Round 2 ruling 8, verifier 2's report
    # committed in bf065fe), and as with round 1 its ledger check binds HEAD's gars/ to the tree its takes
    # ran against, so this job now checks out the done commit by full sha, at full depth, and runs the
    # study's own checks there, unchanged. Round 1's job and the suite job are left as they were.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bf065feedccc0392f69e95a6d674288bb861a2b0
          # Full history: the kickoff baseline, the ledger and the frozen-file checks read the
          # commits that started, froze and registered the study, and refuse in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gap Study round 2 copy
        # Every copied file still traces to round 1's blob, every edit is flagged, and round 1 is
        # unchanged.
        run: python3 evals/gap-study-2/copy_manifest.py --check
      - name: Gap Study round 2 harness
        run: python3 evals/gap-study-2/test_harness.py
      - name: Gap Study round 2 contract quotes
        run: python3 evals/gap-study-2/contracts.py --check
      - name: Gap Study round 2 fixtures
        run: python3 evals/gap-study-2/fixtures/check_fixture.py --all
      - name: Gap Study round 2 language guard
        run: python3 evals/gap-study-2/lint_language.py evals/gap-study-2/
      - name: Gap Study round 2 ledger
        run: python3 evals/gap-study-2/check_results.py --ledger
      - name: Gap Study round 2 controls, as published
        # Before any results file is committed this must exit 0; once results exist, the step
        # requires the re-derived finding byte-identical to the committed record.
        run: |
          set +e
          python3 evals/gap-study-2/check_results.py --controls > "$RUNNER_TEMP/controls.txt" 2>&1
          code=$?
          set -e
          printf 'exit %s\n' "$code" >> "$RUNNER_TEMP/controls.txt"
          if [ -f evals/gap-study-2/verification/controls-as-published.txt ]; then
            diff evals/gap-study-2/verification/controls-as-published.txt "$RUNNER_TEMP/controls.txt"
          else
            cat "$RUNNER_TEMP/controls.txt"
            test "$code" -eq 0
          fi
      - name: Gap Study round 2 costs
        run: python3 evals/gap-study-2/costs.py --check
      - name: Gap Study round 2 mutations
        run: python3 evals/gap-study-2/test_harness.py --mutations

  haiku-prestudy:
    # ---- the Haiku pre-study (evals/haiku-prestudy), checked at every pushed commit while it runs ----
    # A copy of round 2's driver and checkers at bf065fe with one change, a Bash allowlist on every turn.
    # Full history: the copy manifest, the draft builder and the suite read round 2's files at the source
    # commit with git show, and the take ledger binds each row to the commit that introduced it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Haiku pre-study copy
        run: python3 evals/haiku-prestudy/copy_manifest.py --check
      - name: Haiku pre-study suite
        run: python3 -W ignore evals/haiku-prestudy/test_prestudy.py
      - name: Haiku pre-study finding
        run: python3 evals/haiku-prestudy/finding.py --check
      - name: Haiku pre-study language guard
        run: python3 evals/haiku-prestudy/lint_language.py evals/haiku-prestudy/
      - name: Haiku pre-study takes
        # Each committed take, re-checked by the copied take checker; zero takes prints zero and passes.
        run: |
          n=0
          for t in evals/haiku-prestudy/transcripts/*/*/*/*/transcript.jsonl; do
            [ -f "$t" ] || continue
            row=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['row'])" "$(dirname "$t")/driver-ledger.json")
            python3 evals/haiku-prestudy/check_take.py "$t" --task number-fidelity --half positive --row "$row"
            n=$((n+1))
          done
          echo "takes checked: $n"
      - name: Haiku pre-study ledger
        # Once frozen: every attempt tied to exactly one committed row, read at the export commit.
        run: |
          if [ -f evals/haiku-prestudy/prereg.json ]; then
            python3 evals/haiku-prestudy/result.py --ledger
          else
            echo "not frozen yet"
          fi
      - name: Haiku pre-study result
        # Once RESULT.md exists it must be exactly what result.py writes from the committed takes.
        run: |
          if [ -f evals/haiku-prestudy/RESULT.md ]; then
            python3 evals/haiku-prestudy/result.py --check
          else
            echo "no RESULT.md yet"
          fi

  gap-study-3:
    # ---- the Gap Study, round 3 (evals/gap-study-3), checked at the commit its final verifiers checked ----
    # A copy of round 2's instrument at bf065fe with eleven edited files, each with its reason in
    # COPIED.json, and ten pinned byte-identical. While it ran, its guards were checked at every pushed
    # commit. The study is done (final verifiers 2 and 3 PASS against e2979b3, their reports committed in
    # ae30b25 and 96921e1), and as with rounds 1 and 2 its ledger check binds HEAD's gars/ to the tree its
    # takes ran against, so this job now checks out the done commit by full sha, at full depth, and runs
    # the study's own checks there, unchanged. The three jobs above are left exactly as they were.
    #
    # THE ZERO RULE. Each step below either grades a countable number of items or says it graded none.
    # Before the freeze there are no takes and no result, so the two steps that need them report
    # `not applicable — not frozen` rather than a pass. AFTER the freeze, a step that grades zero items
    # is a FAILURE: a green that measured nothing is the defect this study spent a round learning about.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2979b3143081824aadea73523ec41af30c1ddb1
          # Full history: the copy manifest reads round 2's files at their source commit with git show,
          # the round register and the take ledger bind each row to the commit that introduced it, and
          # every one of those refuses in a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Round 3 copy
        # DONE LINE 1: every copied file traces to its blob at the source commit, every edit carries a
        # reason, every pinned file is byte-identical, and the earlier studies are unchanged.
        run: python3 evals/gap-study-3/copy_manifest.py --check
      - name: Round 3 workflow diff is additive
        # DONE LINE 1, second half: this workflow has only gained lines since the kickoff commit.
        run: |
          removed=$(git diff ddf12ebc130e9d18de5ffcb429f7996ebe77baeb HEAD --numstat -- .github/workflows/ \
                    | awk '{s+=$2} END {print s+0}')
          echo "workflow lines removed since the kickoff: $removed"
          test "$removed" -eq 0
      - name: Round 3 suite
        run: python3 -W ignore evals/gap-study-3/test_round3.py
      - name: Round 3 language guard
        # DONE LINE 6, first half. The copied linter, byte-identical to round 2's.
        run: python3 evals/gap-study-3/lint_language.py evals/gap-study-3/
      - name: Round 3 pooling guard
        # DONE LINE 6, second half. Round 3's own, no excusal path, over the folder.
        run: python3 evals/gap-study-3/lint_pooling.py evals/gap-study-3/
      - name: Round 3 pooling guard on the published page
        # REVIEW 4 (register row prefreeze 5), SHOULD 1: the guard never read docs/EVALS.md, the one public
        # page the summary lands on and the one a joining sentence would be written on by hand. Only this
        # round's marked section is read; the earlier rounds' sections are theirs. Says so while no section
        # exists.
        run: python3 evals/gap-study-3/lint_pooling.py --section-of docs/EVALS.md
      - name: Round 3 commit bodies
        # DONE LINE 6 scopes the commit-body scan to the commits SINCE THE FREEZE -- the ones that carry
        # what the study found. This step ran it since the KICKOFF instead, which is wider than the
        # criterion, and two pre-freeze commit bodies are permanently red under it: both are commit
        # messages in which this run DESCRIBED the guard by quoting a sentence the guard forbids. The
        # bodies are pushed and history is never rewritten here, so they cannot be fixed, and the guard
        # has no excusal path by design and is not getting one. Scoped back to what the criterion asks.
        # The two commits are named in verification/commit-body-note.md so no reader meets them cold.
        run: |
          if [ -f evals/gap-study-3/prereg.json ]; then
            freeze=$(git log --format=%H --reverse -- evals/gap-study-3/prereg.json | head -1)
            echo "scanning commit bodies since the freeze commit $freeze"
            python3 evals/gap-study-3/lint_language.py --commits-since "$freeze"
            python3 evals/gap-study-3/lint_pooling.py --commits-since "$freeze"
          else
            echo "not applicable — not frozen; no commit body has carried a finding yet, so this step has"
            echo "scanned none and claims nothing."
          fi
      - name: Round 3 derivation
        # The permission condition re-derives from round 2's committed transcripts, entry for entry.
        run: python3 evals/gap-study-3/allowlist.py --check
      - name: Round 3 draft
        # The draft is what its builder builds, carried keys included.
        run: python3 evals/gap-study-3/build_draft.py --check
      - name: Round 3 leak verdict
        # DONE LINE 4, the fixture half: nothing the agent reads names this checkout, decided by code at
        # path boundaries. The static half grades all six halves; the finding re-derives from round 2's
        # own bytes; --check says out loud when no walk has been committed yet.
        run: |
          python3 evals/gap-study-3/fixture_walk.py --static > /dev/null
          python3 evals/gap-study-3/fixture_walk.py --finding > /dev/null
          python3 evals/gap-study-3/fixture_walk.py --check
      - name: Round 3 leak list
        # Every pre-registered leak word, grepped against every real session this study has recorded,
        # through the take checker's own readers. A word the HARNESS says of its own accord would void
        # every take that ever runs, and nothing else catches it until the first take is thrown away.
        # This runs on every commit, so if the harness's wording moves the excusal stops matching and
        # CI goes red BEFORE a take is voided rather than after.
        run: python3 evals/gap-study-3/leak_grep.py --check
      - name: Round 3 permission mode
        # RULING 2. Every committed session's RECORDED mode, re-derived from its own transcript, against
        # the per-model expectation the pre-registration pins. The assertion round 2's checker could not
        # make, because it compared a constant with itself.
        run: |
          python3 evals/gap-study-3/mode_binding.py --walks --check
          python3 evals/gap-study-3/mode_binding.py --check
      - name: Round 3 review register
        # Every registered round of review has a committed report. An open round blocks the freeze.
        run: python3 evals/gap-study-3/review_kit/rounds.py --check
      - name: Round 3 takes
        # DONE LINE 4: each committed take re-checked by the copied checker, permission mode included.
        # Zero graded takes AFTER the freeze is a failure, not a pass.
        run: |
          n=0
          for t in evals/gap-study-3/transcripts/*/*/*/*/transcript.jsonl; do
            [ -f "$t" ] || continue
            d=$(dirname "$t")
            task=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['task'])" "$d/driver-ledger.json")
            half=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['half'])" "$d/driver-ledger.json")
            row=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['row'])" "$d/driver-ledger.json")
            python3 evals/gap-study-3/check_take.py "$t" --task "$task" --half "$half" --row "$row"
            n=$((n+1))
          done
          echo "takes checked: $n"
          if [ -f evals/gap-study-3/prereg.json ] && [ "$n" -eq 0 ]; then
            echo "FAIL the study is frozen and this step graded 0 takes"
            exit 1
          fi
          if [ ! -f evals/gap-study-3/prereg.json ]; then
            echo "not applicable — not frozen; this step graded $n takes and claims nothing"
          fi
      - name: Round 3 pins, ledger and regrade
        # REVIEW 3 (register row prefreeze 4), SHOULD 1. Round 2's job ran the ledger check after every take
        # and this round's ran none of these, so an edited results file or a misfiled last attempt could
        # have moved a published count with every automatic check green. The pin check re-hashes every
        # pinned file against the freeze; --ledger binds every attempt to its committed row, its
        # transcript's bytes to its ledger, and refuses a rehearsal founded on an edited field; --regrade
        # re-runs the graders into a temporary directory and compares results/ byte for byte. Before the
        # freeze there is nothing for them to bind, and each says so rather than passing.
        run: |
          if [ -f evals/gap-study-3/prereg.json ]; then
            python3 evals/gap-study-3/check_results.py
            python3 evals/gap-study-3/check_results.py --ledger
            python3 evals/gap-study-3/check_results.py --regrade
          else
            echo "not applicable — not frozen; no pin, row or result exists for these to bind"
          fi
      - name: Round 3 result
        # DONE LINE 5: the result re-derives from the committed takes, and every planned cell is either
        # complete or published unmeasured with its reason.
        run: |
          if [ -f evals/gap-study-3/prereg.json ]; then
            python3 evals/gap-study-3/result.py --check
            python3 evals/gap-study-3/completeness.py --check
          else
            echo "not applicable — not frozen; nothing here has graded a cell"
          fi
