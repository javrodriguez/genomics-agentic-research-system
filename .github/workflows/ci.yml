# The deterministic core, on every push -- the same two commands the repo says to run
# before committing (CLAUDE.md). Stdlib only, nothing to install: the helpers and their
# tests run on stock Python >= 3.6 by contract (decision 0011). Tests that need the
# cluster -- a pinned nf-core checkout or the reference tree -- skip cleanly here as
# environment failures, exactly as they do on any machine that is not the cluster.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, deliberately. The pre-registration integrity check below proves that
          # the thresholds were frozen BEFORE the runs, and it can only do that by reading the
          # commit that froze them. At the default depth of 1 that history is absent -- and the
          # check does not merely skip, it used to pass hollowly, comparing the file to itself.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test suite
        run: python3 tests/run_tests.py
      - name: Contract lint
        run: python3 tests/check_contracts.py
      - name: Count guard
        # The suite's size against what README.md and DEVELOPMENT.md claim it is. A wrong count
        # reached eleven job-application files before it was caught by eye; this is why it
        # cannot happen twice.
        run: python3 tests/check_counts.py
      - name: Evaluation harness
        # The Layer B harness's own tests, counted separately from the suite above so the count
        # guard cannot be fooled by tests added here.
        run: python3 evals/test_harness.py
      - name: Pre-registration integrity
        # Thresholds unmoved since the freeze, every pinned file unchanged, every control
        # behaving opposite its positive, every hand-labelled grader suite still passing.
        run: python3 evals/check_results.py --controls --lexicon

      # ---- the Gap Study (evals/gap-study), built beside the first study -------------------
      # Its own harness and checker, run separately so neither study's green can stand in for
      # the other's. The full-depth checkout above is what lets the ledger check read history;
      # at depth 1 it refuses rather than passing hollowly, which is the whole reason
      # fetch-depth: 0 is set.
      - name: Gap Study harness
        # Every grader driven to every label it can emit, including the ones that mean the agent
        # did the wrong thing.
        run: python3 evals/gap-study/test_harness.py
      - name: Gap Study contract quotes
        # Every contract sentence the design rests on is still a byte substring of the blob it
        # was pinned to. A contract edited after the freeze is a visible failure, not a silent
        # change of meaning.
        run: python3 evals/gap-study/contracts.py --check
      - name: Gap Study fixtures
        # Each fixture still accepted by the system under test's own front door, and its counts
        # still equal to what the generator claims. The first study froze a fixture stage 00
        # refuses outright; this is that lesson, executable.
        run: python3 evals/gap-study/fixtures/check_fixture.py --all
      - name: Gap Study language guard
        # The words and number-shapes a three-take study may not publish. An occurrence is
        # excused one line at a time, pinned to that line's exact text.
        run: python3 evals/gap-study/lint_language.py evals/gap-study/
      - name: Gap Study ledger and controls
        # Refuses in a shallow clone rather than reporting a pass it cannot support.
        run: python3 evals/gap-study/check_results.py --ledger --controls
      - name: Gap Study mutations
        # Every guard broken on purpose in a throwaway copy and asserted to go red. A guard nobody
        # has watched fail is a guard nobody knows is wired up, and this study has already shipped
        # four that looked correct and were not.
        run: python3 evals/gap-study/test_harness.py --mutations
