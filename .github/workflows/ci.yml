    steps:
      - uses: actions/checkout@v4
        with:
          # CP8, the publication commit: checkout is pinned by full sha to 1ded8e9a2ada, the head that
          # holds the three final verifier reports, committed unedited. Final verifiers 2 and 3 checked
          # 01479891 and 79d9e45a8 and both returned PASS; 1ded8e9a2ada adds only review records to the
          # head verifier 3 checked, and it is the commit the round's report names in its section 11.
          # The refreshed round 4 page section and the publication tail after this commit are checked
          # outside this job, by a recorded local lint run on the exact published head.
          ref: 1ded8e9a2ada68ecf3ececc1c6c33dd0634f7ca3
          # Full history: the copy gate, ledger and history checks read committed history
          # and refuse in a shallow clone. CP8 adds the full sha ref here.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Language rules
        if: matrix.part == 'checks'
        # Binds the permitted publication language.
        run: python3 evals/gap-study-4/lint_language.py evals/gap-study-4/
      - name: Separation of rounds
        if: matrix.part == 'checks'
        # Binds the fresh baseline's prohibition on joining earlier counts.
        run: python3 evals/gap-study-4/lint_pooling.py evals/gap-study-4/
      - name: Module battery
        # Runs in no leg (no leg is named `none`): the whole battery in one job passed GitHub's 360-minute limit (run
        # 45233717970). The two steps after it run the same modules, guards and rules, split across the battery-N legs.
        if: matrix.part == 'none'
        # Binds every module's clauses, including the workflow contract.
        run: python3 -W ignore evals/gap-study-4/test_round4.py
      - name: Module battery guards and leg plan
        # The battery's own guards (test_round4.module_problems: every tests/*.py is a test module or a named helper,
        # loads, holds a test and sits flat in tests/; discovery finds a test) and the plan's proof: every module in
        # exactly one leg, the legs' tests summing to discovery's count. Every leg runs it before its own work.
        env:
          GAP4_SHARD: plan
        run: |
          cat > "$RUNNER_TEMP/gap4_shard.py" <<'PY'
          import os
          import sys
          import unittest
          from pathlib import Path

          HERE = Path("evals/gap-study-4").resolve()
          sys.path.insert(0, str(HERE))
          import test_round4 as battery  # noqa: E402  the frozen battery: its discovery, guards and rules

          TESTS = battery.TESTS
          leg = os.environ["GAP4_SHARD"]
          plan = {}
          for row in os.environ["GAP4_SHARDS"].splitlines():
              if row.strip():
                  key, _, mods = row.partition(":")
                  plan.setdefault(key.strip(), []).extend(mods.split())   # a long leg continues on rows of the same key
          listed = [m for mods in plan.values() for m in mods]
          whole = battery.suite()
          files = sorted(f.stem for f in TESTS.glob(battery.PATTERN))
          found = sorted({t.id().split(".", 1)[0] for t in battery._leaves(whole)})
          problems = [f"{m} is listed {listed.count(m)} times" for m in sorted(set(listed)) if listed.count(m) > 1]
          problems += [f"{m} is discovered and in no shard" for m in files if m not in listed]
          problems += [f"{m} is in a shard and not discovered" for m in sorted(set(listed)) if m not in files]
          problems += [f"{m} has tests and no file" for m in found if m not in files]
          if whole.countTestCases() == 0:
              problems.append(f"no test found under {TESTS}/{battery.PATTERN}; a battery that runs nothing is not a pass")
          problems += battery.module_problems()
          loaded = {}
          for m in listed:
              if m in files and m not in loaded:
                  loaded[m] = unittest.defaultTestLoader.discover(str(TESTS), pattern=m + ".py", top_level_dir=str(TESTS))
          counts = {k: sum(loaded[m].countTestCases() for m in mods if m in loaded) for k, mods in plan.items()}
          if sum(counts.values()) != whole.countTestCases():
              problems.append(f"the shards hold {sum(counts.values())} tests and discovery {whole.countTestCases()}")
          for k, mods in plan.items():
              print(f"gap4 shard {k}: {len(mods)} modules, {counts[k]} tests")
          print(f"gap4 shards: {len(plan)} shards, {len(listed)} modules of {len(files)} discovered, "
                f"{sum(counts.values())} tests of {whole.countTestCases()}")
          for p in problems:
              print(f"gap4 shards: {p}")
          if problems:
              raise SystemExit(1)
          if leg == "plan":
              raise SystemExit(0)
          if leg not in plan:
              raise SystemExit(f"gap4 shards: no shard {leg}")
          s = unittest.TestSuite(loaded[m] for m in plan[leg])
          entry_out, entry_argv = sys.stdout, list(sys.argv)
          result = unittest.TextTestRunner(verbosity=2).run(s)
          leaked = battery.leaked_globals(entry_out, entry_argv)
          for b in leaked:
              print(f"test_round4 shard {leg}: {b}")
          banned = [(str(t), why) for t, why in result.skipped if why not in battery.SKIP_ALLOWED]
          for test, why in banned:
              print(f"test_round4 shard {leg}: skipped, and its reason is not in SKIP_ALLOWED: {test}: {why}")
          for test, _trace in result.expectedFailures:
              print(f"test_round4 shard {leg}: an expected failure, which the battery never allows: {test}")
          xfail = len(result.expectedFailures)
          short = result.testsRun != counts[leg]
          if short:
              print(f"test_round4 shard {leg}: {result.testsRun} tests ran of the {counts[leg]} it holds")
          print(f"test_round4 shard {leg}: {result.testsRun - len(result.skipped)} run, {len(result.skipped)} skipped, "
                f"{xfail} expected failures", flush=True)
          raise SystemExit(0 if result.wasSuccessful() and not banned and not xfail and not leaked and not short else 1)
          PY
          python3 -W ignore "$RUNNER_TEMP/gap4_shard.py"
      - name: Module battery, one leg
        # This leg's modules through the battery's own rules: the verbose runner, a skip only for a reason in
        # SKIP_ALLOWED, no expected failure, sys.stdout and sys.argv put back and named, every test the leg holds run,
        # and a closing line `test_round4 shard <leg>: <n> run, <m> skipped, 0 expected failures`.
        if: startsWith(matrix.part, 'battery-')
        env:
          GAP4_SHARD: ${{ matrix.part }}
        run: python3 -W ignore "$RUNNER_TEMP/gap4_shard.py"
      - name: Copy record
        if: matrix.part == 'checks'
        # PL-5(c), w5b-4: bind pre-freeze HEAD or the freeze commit; never post-freeze HEAD.
        # Fold 13: only the freeze commit's own code then lists what HEAD added, so a later file cannot shadow the reader;
        # an importable file no run writes fails, any other is printed.
        run: |
          if [ ! -f evals/gap-study-4/prereg.json ]; then
            echo "copy gate commit: $(git rev-parse HEAD)"
            python3 evals/gap-study-4/copy_manifest.py --check
          else
            freeze=$(git log --format=%H --reverse -- evals/gap-study-4/prereg.json | head -1)
            test -n "$freeze"
            copy_root="$RUNNER_TEMP/frozen-tree"
            git worktree add --detach "$copy_root" "$freeze"
            trap 'git worktree remove "$copy_root"' EXIT
            echo "copy gate commit: $freeze"
            python3 "$copy_root/evals/gap-study-4/copy_manifest.py" --check
            python3 "$copy_root/evals/gap-study-4/copy_manifest.py" --later-files "$(git rev-parse HEAD)"
          fi
      - name: Round 4 pooling guard on the published page
        if: matrix.part == 'checks'
        # Pre-freeze review 1, m14: round 3's step, ported. Only this round's marked section of
        # docs/EVALS.md is read, and the step says so while no section exists; never a pass. Pre-freeze
        # review 2, m5: --allow-absent only while no RESULT.md exists; after it, no section is a red.
        run: python3 evals/gap-study-4/lint_pooling.py --section-of docs/EVALS.md $(test -f evals/gap-study-4/RESULT.md || echo --allow-absent)
      - name: Round 4 language rules on the published page
        if: matrix.part == 'checks'
        # Lane review 3 (pf1-l2b): the language rules, the comparatives included, over this round's
        # marked section of docs/EVALS.md only; the step says so while no section exists.
        run: python3 evals/gap-study-4/lint_language.py --section-of docs/EVALS.md $(test -f evals/gap-study-4/RESULT.md || echo --allow-absent)
      - name: Round 4 commit bodies
        if: matrix.part == 'checks'
        # Pre-freeze review 1, m14: round 3's step, ported. The commit bodies since the freeze
        # commit, the ones that carry what the study found; before the freeze it says so.
        run: |
          if [ -f evals/gap-study-4/prereg.json ]; then
            freeze=$(git log --format=%H --reverse -- evals/gap-study-4/prereg.json | head -1)
            test -n "$freeze"
            echo "scanning commit bodies since the freeze commit $freeze"
            python3 evals/gap-study-4/lint_language.py --commits-since "$freeze"
            python3 evals/gap-study-4/lint_pooling.py --commits-since "$freeze"
          else
            echo "not applicable — not frozen"
          fi
      - name: Round 4 workflow diff is additive
        if: matrix.part == 'checks'
        # Binds this workflow to added lines only since the introducing commit.
        run: |
          git cat-file -e ad88d14d82f8e88e5bf6253f03faadcfbbb242f4^{commit}
          removed=$(git diff ad88d14d82f8e88e5bf6253f03faadcfbbb242f4 HEAD --numstat -- .github/workflows/ \
                    | awk '{s+=$2} END {print s+0}')
          echo "workflow lines removed since the kickoff: $removed"
          test "$removed" -eq 0
      - name: Box integration
        if: matrix.part == 'checks'
        # Binds the integrated box interface supplied by CP2.
        run: python3 -W ignore evals/gap-study-4/tests/test_box_integration.py
      - name: Pipeline integration
        if: matrix.part == 'checks'
        # Binds registration, identity, freeze and publication contracts.
        run: python3 -W ignore evals/gap-study-4/tests/test_pipeline.py
      - name: Constructed cases
        if: matrix.part == 'checks'
        # Binds the task expectations, mirroring plan 299's validity command.
        run: python3 evals/gap-study-4/probes4.py --check
      - name: Draft derivation
        if: matrix.part == 'checks'
        # Binds the committed draft to its builder; an absent draft fails loudly.
        run: python3 evals/gap-study-4/build_draft.py --check
      - name: Context words
        if: matrix.part == 'checks'
        # Binds the word list against recorded sessions; zero sessions is no pass.
        run: python3 evals/gap-study-4/leak_grep.py --check
      - name: Private material deferred
        if: matrix.part == 'checks'
        # The local command belongs to freeze_rehearsal.py at the freeze, outside CI.
        run: echo "holdout lives in the private aegis repo; checked locally at each freeze step"
      - name: Review register
        if: matrix.part == 'checks'
        # Binds each registered review to its committed report.
        run: python3 evals/gap-study-4/review_kit/rounds.py --check
      - name: Walk register
        if: matrix.part == 'checks'
        # Binds each registered walk to the one walk commit that wrote it; zero walks is said, not passed.
        run: python3 evals/gap-study-4/walk_register.py --check
      - name: Frozen pins
        if: matrix.part == 'frozen-pins'
        # Binds frozen bytes and publication; zero records after the freeze fails.
        run: |
          if [ -f evals/gap-study-4/prereg.json ]; then
            python3 -c "import sys; sys.path.insert(0, 'evals/gap-study-4'); import stats; n = len(stats.load_results()); print(f'records available: {n}'); raise SystemExit(0 if n else 'FAIL: frozen and 0 records')"
            python3 evals/gap-study-4/check_results.py
          else
            echo "not applicable — not frozen"
          fi
      - name: Committed ledger
        if: matrix.part == 'committed-ledger'
        # Binds registrations to history; zero records after the freeze fails.
        run: |
          if [ -f evals/gap-study-4/prereg.json ]; then
            python3 -c "import sys; sys.path.insert(0, 'evals/gap-study-4'); import stats; n = len(stats.load_results()); print(f'records available: {n}'); raise SystemExit(0 if n else 'FAIL: frozen and 0 records')"
            python3 evals/gap-study-4/check_results.py --ledger
          else
            echo "not applicable — not frozen"
          fi
      - name: Recomputed labels
        if: matrix.part == 'recomputed-labels'
        # Binds plan 1036 as written. OPEN-value: regrade-flag; its implementation is owed.
        run: |
          if [ -f evals/gap-study-4/prereg.json ]; then
            python3 -c "import sys; sys.path.insert(0, 'evals/gap-study-4'); import stats; n = len(stats.load_results()); print(f'records available: {n}'); raise SystemExit(0 if n else 'FAIL: frozen and 0 records')"
            python3 evals/gap-study-4/check_results.py --regrade
          else
            echo "not applicable — not frozen"
          fi
      - name: Published result
        if: matrix.part == 'published-result'
        # Binds the rendered result to committed records; zero records fails.
        run: |
          if [ -f evals/gap-study-4/prereg.json ]; then
            python3 -c "import sys; sys.path.insert(0, 'evals/gap-study-4'); import stats; n = len(stats.load_results()); print(f'records available: {n}'); raise SystemExit(0 if n else 'FAIL: frozen and 0 records')"
            python3 evals/gap-study-4/result.py --check
          else
            echo "not applicable — not frozen"
          fi
      - name: Planned cells
        if: matrix.part == 'planned-cells'
        # Binds every planned cell's disposition; zero records fails.
        run: |
          if [ -f evals/gap-study-4/prereg.json ]; then
            python3 -c "import sys; sys.path.insert(0, 'evals/gap-study-4'); import stats; n = len(stats.load_results()); print(f'records available: {n}'); raise SystemExit(0 if n else 'FAIL: frozen and 0 records')"
            python3 evals/gap-study-4/completeness.py --check
          else
            echo "not applicable — not frozen"
          fi
