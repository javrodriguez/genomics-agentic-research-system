# The yeast ATAC exemplar, re-run from its reproduction package (decisions 0281, 0283).
#
# Job `self-check` runs the package's offline verify.py and shellcheck on rerun.sh, in minutes.
# Job `rerun` runs the package's own commands on a GitHub-hosted runner, exactly as REPRODUCE.md
# prints them: `bash rerun.sh --out <folder>`, then `python3 verify.py --against <folder>
# --table-out <folder>`. It passes only when the re-run's result line equals the line the committed
# landing README (reproduction/yeast-atac/README.md) states, no output holds a file the run did not
# record, and every member's mode and result equals reproduction/yeast-atac/agreed-members.tsv (the
# two pre-landing passes' agreed outcomes, written by `rerun-note`); the members a finding in
# package-tolerances.json names, whose difference has a cause stated in PROVENANCE.md, may match or
# differ, but never go missing. Its member table, the package digest it verified and the machine,
# as Docker reports it, are uploaded as the artifact `rerun-note` reads.
#
# Disk: a cold-cache pass used about 15 GB of root disk (0283), more than the runner's free space,
# so the job first removes preinstalled toolchains this re-run never uses and records free space.
#
# The schedule's honest limit: GitHub disables a scheduled workflow after 60 days without repository
# activity, so a page quoting this job shows the date of a pinned run, never a standing promise.
name: Reproduction (yeast ATAC)

on:
  workflow_dispatch:
  schedule:
    - cron: "41 7 5 * *"

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reproduction/yeast-atac
          persist-credentials: false
      - name: The package verifies offline
        run: python3 reproduction/yeast-atac/package/verify.py
      - name: rerun.sh is shellcheck-clean
        run: shellcheck reproduction/yeast-atac/package/rerun.sh

  rerun:
    needs: self-check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reproduction/yeast-atac
          persist-credentials: false
      - name: Free disk (toolchains this re-run never uses)
        run: |
          df -B1 --output=avail / | tail -1 > "$RUNNER_TEMP/free-before.txt"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -B1 --output=avail / | tail -1 > "$RUNNER_TEMP/free-after.txt"
          echo "free root disk: $(cat "$RUNNER_TEMP/free-before.txt") bytes before, $(cat "$RUNNER_TEMP/free-after.txt") after" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(cat "$RUNNER_TEMP/free-after.txt")" -ge 17000000000
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: The Nextflow launcher, pinned by sha256 (rerun.sh pins the version the run recorded)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/nextflow-io/nextflow/releases/download/v26.04.6/nextflow \
            -o "$HOME/.local/bin/nextflow"
          echo "61a755edbed743cfbb568f3a6c67af68481a2f6a4d6dffcc4295e51318968281  $HOME/.local/bin/nextflow" \
            | sha256sum -c -
          chmod +x "$HOME/.local/bin/nextflow"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Re-run from the package
        run: |
          start=$(date +%s)
          bash reproduction/yeast-atac/package/rerun.sh --out "$RUNNER_TEMP/rerun"
          echo "rerun.sh exit 0, wall time $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare with the run's record and the landing README
        run: |
          set +e
          python3 reproduction/yeast-atac/package/verify.py --against "$RUNNER_TEMP/rerun" \
            --table-out "$RUNNER_TEMP/artifact" > "$RUNNER_TEMP/verify.txt"
          code=$?
          set -e
          cat "$RUNNER_TEMP/verify.txt"
          line="$(tail -n 1 "$RUNNER_TEMP/verify.txt")"
          {
            echo "verify.py exit $code"
            echo '```'
            cat "$RUNNER_TEMP/verify.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in 0|2|3) ;; *) echo "verify.py could not compare (exit $code)"; exit 1 ;; esac
          read -r ncpu mem < <(docker info --format '{{.NCPU}} {{.MemTotal}}')
          printf '%s\n%s\n' "GitHub-hosted runner, Docker ${ncpu} CPUs and ${mem} bytes, no image cached" \
            "$(date -u +%Y-%m-%d)" > "$RUNNER_TEMP/artifact/machine.txt"
          if grep -qF -- "$line" reproduction/yeast-atac/README.md; then
            echo "the result line equals the landing README's" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "the result line differs from the landing README's: $line" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Every member's mode and result equals the agreed outcome
        run: |
          python3 - reproduction/yeast-atac/agreed-members.tsv "$RUNNER_TEMP/artifact/members.tsv" \
            reproduction/yeast-atac/package/outputs/package-tolerances.json "$RUNNER_TEMP/artifact/outputs.tsv" <<'PY'
          import csv, json, sys
          agreed_path, rerun_path, tolerances_path, outputs_path = sys.argv[1:5]
          def table(path):
              with open(path, encoding='utf-8', newline='') as handle:
                  return {(r['stage'], r['path']): (r['mode'], r['result'])
                          for r in csv.DictReader(handle, delimiter='\t')}
          agreed, rerun = table(agreed_path), table(rerun_path)
          findings = {(f.get('stage'), m) for f in json.load(open(tolerances_path)).get('findings') or []
                      for m in f.get('members') or []}
          if set(agreed) != set(rerun):
              sys.exit('the re-run lists other members than agreed-members.tsv')
          bad = [k for k in sorted(agreed) if agreed[k] != rerun[k]
                 and not (k in findings and agreed[k][0] == rerun[k][0] and rerun[k][1] in ('match', 'differs'))]
          for stage, path in bad:
              print('%s %s: agreed %s, re-run %s' % (stage, path, agreed[(stage, path)], rerun[(stage, path)]))
          with open(outputs_path, encoding='utf-8', newline='') as handle:
              extra = [r for r in csv.DictReader(handle, delimiter='\t') if r['extra'] != '0']
          for r in extra:
              print('%s %s: %s file(s) the run did not record' % (r['stage'], r['output_path'], r['extra']))
          if bad or extra:
              sys.exit('%d members differ from the agreed outcome; %d outputs hold unrecorded files'
                       % (len(bad), len(extra)))
          print('all %d members match the agreed outcome (%d finding members free to vary)'
                % (len(agreed), len(findings & set(agreed))))
          PY
      - name: The pass artifact (what rerun-note reads)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerun-note-artifact
          path: ${{ runner.temp }}/artifact
          if-no-files-found: warn
          retention-days: 90
